<style>
/* 版面：頂部名稱與分頁固定，下方為可搜尋的清單；區域分頁左為地圖、右為房間與 NPC。
   色彩取自青瓷與朱砂印泥：青瓷綠為主色，朱砂只用在唯一、劇毒這類警示標記。 */
:root {
  --bg: #edf1ee;
  --panel: #f8faf8;
  --sunk: #e3e9e5;
  --fg: #1b2420;
  --muted: #5b6a63;
  --line: #cdd7d1;
  --accent: #2c6a58;
  --accent-soft: #d5e6de;
  --seal: #a3372a;
  --seal-soft: #f3dcd7;
  --gold: #7d6310;
  --room: #ffffff;
  --room-line: #9fb3a9;
  --c-black: #6b7470; --c-red: #b3261e; --c-green: #1f7a3d; --c-yellow: #8a6a00;
  --c-blue: #1f4fb3; --c-magenta: #8e2f8e; --c-cyan: #0b7385; --c-white: #4f5b66;
  --serif: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111614; --panel: #171e1b; --sunk: #0d1210; --fg: #e1e8e4; --muted: #92a39a; --line: #2a3530;
    --accent: #72c2a6; --accent-soft: #1d3530; --seal: #e57866; --seal-soft: #3a1f1b; --gold: #d8b64f;
    --room: #1d2622; --room-line: #3d4f47;
    --c-black: #8d9894; --c-red: #ff7b72; --c-green: #6fd08c; --c-yellow: #e8c547;
    --c-blue: #7aa7ff; --c-magenta: #e08ae0; --c-cyan: #5fd3e0; --c-white: #f2f5f4;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111614; --panel: #171e1b; --sunk: #0d1210; --fg: #e1e8e4; --muted: #92a39a; --line: #2a3530;
  --accent: #72c2a6; --accent-soft: #1d3530; --seal: #e57866; --seal-soft: #3a1f1b; --gold: #d8b64f;
  --room: #1d2622; --room-line: #3d4f47;
  --c-black: #8d9894; --c-red: #ff7b72; --c-green: #6fd08c; --c-yellow: #e8c547;
  --c-blue: #7aa7ff; --c-magenta: #e08ae0; --c-cyan: #5fd3e0; --c-white: #f2f5f4;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; }
header.top .wrap { padding-block: 0; }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.brand { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; padding-block: 14px 8px; }
.brand h1 { margin: 0; font-family: var(--serif); font-size: 1.55rem; letter-spacing: 0.08em; }
.brand .tally { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
nav.tabs button { flex: 0 0 auto; border: 0; background: none; color: var(--muted); font: 500 0.98rem var(--sans); padding: 8px 14px; border-bottom: 2px solid transparent; cursor: pointer; }
nav.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
nav.tabs button:focus-visible, .chip:focus-visible, .row-head:focus-visible, .linkish:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding-block: 16px 10px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--hdr, 100px)); z-index: 15; background: var(--bg); border-bottom: 1px solid var(--line); }
.search { flex: 1 1 260px; min-width: 0; font: 0.95rem var(--sans); padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--fg); }
.search:focus { outline: 2px solid var(--accent); outline-offset: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 999px; padding: 3px 12px; font: 0.88rem var(--sans); cursor: pointer; }
.chip .n { color: var(--muted); font-variant-numeric: tabular-nums; margin-left: 4px; font-size: 0.8rem; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.chip[aria-pressed="true"] .n { color: var(--panel); opacity: 0.8; }
.hint { color: var(--muted); font-size: 0.85rem; }
.list { }
.row { border-bottom: 1px solid var(--line); }
.row-head { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1.6fr) 7.5em; gap: 4px 16px; align-items: baseline; padding: 9px 4px; cursor: pointer; width: 100%; text-align: left; border: 0; background: none; color: inherit; font: inherit; }
.row-head:hover { background: var(--sunk); }
.row.open > .row-head { background: var(--accent-soft); }
.nm { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.nm .en { font-weight: 400; color: var(--muted); font-size: 0.82rem; margin-left: 6px; }
.sum { color: var(--muted); font-size: 0.88rem; min-width: 0; overflow-wrap: anywhere; }
.num { text-align: right; font-variant-numeric: tabular-nums; font-size: 0.88rem; color: var(--muted); }
.tag { display: inline-block; font-size: 0.72rem; letter-spacing: 0.04em; padding: 0 6px; border-radius: 3px; margin-left: 6px; vertical-align: 2px; border: 1px solid var(--line); color: var(--muted); font-weight: 500; }
.tag.seal { border-color: var(--seal); color: var(--seal); background: var(--seal-soft); }
.tag.gold { border-color: var(--gold); color: var(--gold); }
.tag.ok { border-color: var(--accent); color: var(--accent); }
.detail { padding: 4px 4px 18px; display: grid; gap: 14px; }
.detail .long { white-space: pre-wrap; font-family: var(--serif); line-height: 1.8; max-width: 44em; margin: 0; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 14px; font-size: 0.9rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; font-size: 0.88rem; min-width: 18em; }
th, td { text-align: left; padding: 4px 14px 4px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; }
td.v { font-variant-numeric: tabular-nums; text-align: right; padding-right: 20px; }
.traits { display: flex; flex-wrap: wrap; gap: 6px 18px; }
.trait-group h4 { margin: 0 0 4px; font: 500 0.82rem var(--sans); color: var(--muted); letter-spacing: 0.05em; }
code, .file { font-family: var(--mono); font-size: 0.82rem; }
.file { color: var(--muted); overflow-wrap: anywhere; }
pre.code { font-family: var(--mono); font-size: 0.8rem; background: var(--sunk); padding: 10px 12px; border-radius: 6px; overflow-x: auto; margin: 0; white-space: pre; }
.linkish { color: var(--accent); background: none; border: 0; padding: 0; font: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.copy { font: 0.75rem var(--sans); border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: 4px; padding: 0 6px; margin-left: 8px; cursor: pointer; }
.empty { color: var(--muted); padding: 24px 4px; }
/* 區域 */
.area-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.map-box { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; min-width: 0; }
.map-scroll { overflow: auto; max-height: 70vh; }
.map-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: 0.8rem; padding: 6px 2px 0; }
.layer-title { font: 600 0.9rem var(--serif); color: var(--muted); margin: 6px 2px 2px; }
svg.map text { font-family: var(--sans); font-size: 12px; fill: var(--fg); pointer-events: none; }
svg.map .room rect { fill: var(--room); stroke: var(--room-line); stroke-width: 1; rx: 5; }
svg.map .room.has-npc rect { stroke: var(--accent); stroke-width: 1.6; }
svg.map .room.sel rect { fill: var(--accent); stroke: var(--accent); }
svg.map .room.sel text { fill: var(--panel); }
svg.map .room.hl rect { stroke: var(--seal); stroke-width: 2.4; }
svg.map .room { cursor: pointer; }
svg.map .room:focus-visible rect { stroke: var(--seal); stroke-width: 2.4; }
svg.map line { stroke: var(--room-line); stroke-width: 2; }
svg.map line.cmd { stroke: var(--accent); stroke-width: 1.6; stroke-dasharray: 5 4; }
svg.map .dot { fill: var(--accent); }
svg.map .ud { font-size: 10px; fill: var(--muted); }
.side { display: grid; gap: 16px; min-width: 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; min-width: 0; }
.panel h3 { margin: 0 0 6px; font-family: var(--serif); font-size: 1.1rem; }
.npc-list { display: flex; flex-wrap: wrap; gap: 6px; }
.npc-list .chip { font-size: 0.85rem; }
.stats { display: flex; flex-wrap: wrap; gap: 4px 18px; color: var(--muted); font-size: 0.88rem; font-variant-numeric: tabular-nums; }
/* NPC 視窗 */
.overlay { position: fixed; inset: 0; background: rgba(10, 16, 13, 0.45); z-index: 50; display: grid; place-items: center; padding: 16px; }
.dialog { background: var(--panel); color: var(--fg); border-radius: 10px; border: 1px solid var(--line); width: min(640px, 100%); max-height: 88vh; overflow: auto; padding: 18px 20px 20px; display: grid; gap: 12px; }
.dialog h2 { margin: 0; font-family: var(--serif); font-size: 1.35rem; }
.dlg-head { display: flex; align-items: flex-start; gap: 12px; }
.dlg-head h2 { flex: 1 1 auto; min-width: 0; }
.dialog .close { flex: none; margin: 0; min-width: 4.5em; min-height: 32px; padding: 4px 12px; font-size: 0.85rem; line-height: 1.2; }
/* 遊戲裡的 ANSI 顏色 */
.a1 { font-weight: 700; }
.a30 { color: var(--c-black); } .a31 { color: var(--c-red); } .a32 { color: var(--c-green); } .a33 { color: var(--c-yellow); }
.a34 { color: var(--c-blue); } .a35 { color: var(--c-magenta); } .a36 { color: var(--c-cyan); } .a37 { color: var(--c-white); }
@media (max-width: 760px) {
  .area-grid { grid-template-columns: minmax(0, 1fr); }
  .row-head { grid-template-columns: minmax(0, 1fr) auto; }
  .row-head .sum { grid-column: 1 / -1; grid-row: 2; }
}
@media (prefers-reduced-motion: no-preference) { .row-head { transition: background 0.12s; } }
</style>

custom/weapon/blade/evil_lopsided_blade.c","name":"\u001b[1;30m邪門歪刀\u001b[m","ids":["evil-lopsided blade","blade"],"long":"一把黑沉沉，刀身盡是歪刃倒勾的細長單刀。\n你見到刀柄上刻著「邪門一刀，歪打正著」八個小字。","weight":6100,"value":"850 兩","unit":"把","flags":["唯一"],"kind":"blade","usages":[{"skill":"刀法","code":"blade","dmg":"8 - 41","bonus":"90%","mult":3}],"traits":{"刀法":[["拆招卸力之法",10,"parry"],["攻擊能力值",20,"attack"]]}},{"id":"/custom/weapon/blade/feather_blade","file":"source/upstream/mudlib/custom/weapon/blade/feather_blade.c","name":"\u001b[1;32m翠羽刀\u001b[m","ids":["feather blade","blade"],"long":"此刀通身翠綠，如同孔雀的羽毛一樣美麗。輕輕揮舞，猶如\n一隻孔雀在風中獨舞，美得讓人心碎。江湖之中勝傳此刀內\n藏有火神鳳凰的羽毛。","weight":9200,"value":"750 兩","unit":"把","flags":[],"kind":"blade","usages":[{"skill":"刀法","code":"blade","dmg":"7 - 64","bonus":"110%","mult":3}],"traits":{"刀法":[["風擊傷害防禦力",65,"armor_vs_wind"],["攻勢等級",25,"intimidate"],["大邪七損刀訣",5,"seven_blade"],["攻擊能力值",15,"attack"]]}},{"id":"/custom/weapon/blade/fire_gods_wings","file":"source/upstream/mudlib/custom/weapon/blade/fire_gods_wings.c","name":"\u001b[1;31m火神之翼\u001b[m","ids":["fire god's wings","blade"],"long":"這是一把火光閃耀的百斤大刀。刀身造型典雅，猶如展開的鳳凰的翅膀。鋒利\n的刀刃上紅光閃現，仿彿燃燒著來自地獄的火焰，使人產生一種難以抵抗的壓\n迫感。","weight":21800,"value":"500 兩","unit":"把","flags":[],"kind":"blade","usages":[{"skill":"雙握刀法","code":"twohanded blade","dmg":"8 - 84","bonus":"195%","mult":4}],"traits":{"雙握刀法":[["膽識",4,"cor"],["火焰傷害防禦力",150,"armor_vs_fire"],["傷害力",30,"damage"],["天師道法【火術】",30,"taoism-fire"]]}},{"id":"/custom/weapon/blade/flame_weapon","file":"source/upstream/mudlib/custom/weapon/blade/flame_weapon.c","name":"妄焱兵絕","ids":["flame weapon","blade"],"long":"一把鏽黑的兵器，刃身上隱隱有火熾的痕跡。","weight":4000,"value":"250 兩","unit":"把","flags":[],"kind":"blade","usages":[{"skill":"刀法","code":"blade","dmg":"2 - 26","bonus":"80%","mult":2}],"traits":{}},{"id":"/custom/weapon/blade/flame_weapon_forged","file":"source/upstream/mudlib/custom/weapon/blade/flame_weapon_forged.c","name":"\u001b[1;31m妄焱兵絕\u001b[m","ids":["flame weapon","blade"],"long":"以煢榮宿鐵為體 的寶刀, 刀身隱隱泛出溫和的白光","weight":14500,"value":"800 兩","unit":"把","flags":[],"kind":"blade","usages":[{"skill":"雙握刀法","code":"twohanded blade","dmg":"3 - 48","bonus":"105%","mult":3}],"traits":{"雙握刀法":[["攻擊能力值",10,"attack"],["攻勢等級",10,"intimidate"],["拆招卸力之法",10,"parry"]]}},{"id":"/custom/weapon/blade/poison_wind_blade","file":"source/upstream/mudlib/custom/weapon/blade/poison_wind_blade.c","name":"\u001b[1;34m酖風刀\u001b[m","ids":["poison wind blade","blade"],"long":"血絕門的鎮門寶刀，長期浸泡於萬毒藥水中，刀身散發出一縷黑氣，彷彿有生命般地呼吸著。","weight":21400,"value":"800 兩","unit":"把","flags":[],"kind":"blade","usages":[{"skill":"雙握刀法","code":"twohanded blade","dmg":"7 - 82","bonus":"135%","mult":3}],"traits":{"雙握刀法":[["內功",10,"force"],["傷害力",10,"damage"],["警覺性",50,"awarness"]]}},{"id":"/custom/weapon/blade/purple_dragon_blade","file":"source/upstream/mudlib/custom/weapon/blade/purple_dragon_blade.c","name":"\u001b[1;35m紫薇伏龍刀\u001b[m","ids":["purple dragon blade","blade"],"long":"一柄散發著陣陣紫氣的短刀。鑄造此刀的材料和工藝來源於奐族，所以\n天朝境內很少有人用過這把短刀。","weight":6100,"value":"40 兩","unit":"把","flags":[],"kind":"blade","usages":[{"skill":"左手刀法","code":"secondhand blade","dmg":"8 - 23","bonus":"90%","mult":3},{"skill":"刀法","code":"blade","dmg":"8 - 41","bonus":"90%","mult":3}],"traits":{"左手刀法":[["傷害力",5,"damage"],["膂力",1,"str"]],"刀法":[["傷害力",5,"damage"],["膂力",1,"str"]]}},{"id":"/custom/weapon/blade/reckless_blade","file":"source/upstream/mudlib/custom/weapon/blade/reckless_blade.c","name":"\u001b[1;33m龍紋\u001b[m斬馬刀","ids":["reckless blade","blade"],"long":"一把背串銅環的七尺斬馬大刀，與眾不同的是，此刀的刀背上鑲有一條銅\n製的臥龍，不僅美觀了許多，額外的重量也提高了此刀的殺傷力。","weight":19400,"value":"250 兩","unit":"把","flags":[],"kind":"blade","usages":[{"skill":"雙握刀法","code":"twohanded blade","dmg":"8 - 72","bonus":"172%","mult":4}],"traits":{"雙握刀法":[["傷害力",10,"damage"],["攻擊能力值",10,"attack"],["瘋虎刀法",15,"tiger-blade"]]}},{"id":"/custom/weapon/blade/snow_blade","file":"source/upstream/mudlib/custom/weapon/blade/snow_blade.c","name":"\u001b[1;37m啐雪大刀\u001b[m","ids":["snow blade","blade"],"long weapon/sword/au_han_sword","file":"source/upstream/mudlib/custom/weapon/sword/au_han_sword.c","name":"\u001b[0;35m古劍醒塵\u001b[m","ids":["au-han sword","sword"],"long":"此劍乃上古時代所煉鑄之神兵利器。玄陽真人雲遊諸神之地, 忽見到一寒池中\n隱閃紫光, 於是潛入探查, 竟發現一塊渾然天成的劍形紫晶, 便將之帶回居所\n, 苦尋神劍煉法, 耗盡三十年精力與心血, 最後亦以自身鮮血, 賦予此劍純正\n靈氣, 並將此劍插於清虛峰頂七七四十九天, 吸取日陽月華的至陰至陽。玄陽\n鑄此劍時立下大願, 要以此劍醒濁塵，故此劍名曰「醒塵」。","weight":9400,"value":"650 兩","unit":"把","flags":["唯一"],"kind":"sword","usages":[{"skill":"劍術","code":"sword","dmg":"8 - 65","bonus":"150%","mult":3}],"traits":{"劍術":[["膽識",2,"cor"],["定力",2,"cps"],["攻擊能力值",30,"attack"]]}},{"id":"/custom/weapon/sword/black_shortsword","file":"source/upstream/mudlib/custom/weapon/sword/black_shortsword.c","name":"黑色短劍","ids":["black shortsword","sword"],"long":"一把由玄鐵打造而成的短劍, 劍身還刻了幾個小字.","weight":3200,"value":"450 兩","unit":"把","flags":[],"kind":"sword","usages":[{"skill":"劍術","code":"sword","dmg":"2 - 20","bonus":"50%","mult":2},{"skill":"左手劍術","code":"secondhand sword","dmg":"2 - 10","bonus":"50%","mult":2}],"traits":{"劍術":[["靈性",1,"spi"],["攻擊能力值",12,"attack"]],"左手劍術":[["靈性",1,"spi"],["攻擊能力值",12,"attack"]]}},{"id":"/custom/weapon/sword/black_sword","file":"source/upstream/mudlib/custom/weapon/sword/black_sword.c","name":"黑劍","ids":["black sword","sword"],"long":"一把細劍, 長度較一般長劍略短, 劍身呈墨黑, 份量相當的輕。","weight":7200,"value":"100 兩","unit":"把","flags":[],"kind":"sword","usages":[{"skill":"劍術","code":"sword","dmg":"7 - 49","bonus":"100%","mult":3},{"skill":"左手劍術","code":"secondhand sword","dmg":"7 - 25","bonus":"100%","mult":3}],"traits":{"劍術":[["攻擊能力值",15,"attack"],["機敏",2,"dex"]],"左手劍術":[["機敏",1,"dex"]]}},{"id":"/custom/weapon/sword/blackthorn","file":"source/upstream/mudlib/custom/weapon/sword/blackthorn.c","name":"\u001b[1;30m玄蘇劍\u001b[m","ids":["blackthorn","sword"],"long":"這是一把劍身黝黑，劍刃生滿細刺的古劍，向來是封山劍派掌門人\n所使用的配劍，據說這把劍不會染血，而且經常散發出一股可怕的\n殺氣。","weight":23900,"value":"300 兩","unit":"把","flags":[],"kind":"sword","usages":[{"skill":"雙握劍術","code":"twohanded sword","dmg":"7 - 94","bonus":"157%","mult":3 ],"cat":"丹藥","effects":["飲水 -15","食物 +5","精實格 -5","精 -5","氣 +35","氣 +60","形體 +20"]},{"id":"/obj/medication/alchemist/mix_recipe","file":"source/upstream/mudlib/obj/medication/alchemist/mix_recipe.c","name":"混合藥丹","ids":["mixed pill","mixed","pill"],"long":"這是一種正在測試中的藥丹, 藥性未知, 請勿誤食, 否則後果自負。","weight":5,"value":"10 兩","unit":"些","flags":[],"cat":"丹藥","effects":["飲水 -20","食物 +3","精實格 -3","精 -5","氣 +35","氣 +60","形體 +20"]},{"id":"/obj/medication/alchemist/mjp_1","file":"source/upstream/mudlib/obj/medication/alchemist/mjp_1.c","name":"\u001b[1;33m大還丹\u001b[0m","ids":["major heal pill","major","pill"],"long":"大還丹是一種極神奇的仙丹, 具強大的療效可以讓服用者的\n內外傷在瞬間癒合, 不過煉製大還丹所需的藥材除了小還丹\n所需的幾樣藥材外, 還必需找尋雪蓮, 千年人蔘等數種罕見\n的珍貴藥材。因此, 大還丹除了燒煉困難外, 藥材之價格亦\n極昂貴。這顆丹外表呈淡淡的金黃色, 乃鍊製過程中火候十\n足之表徵, 為百中選一之極品小還丹。","weight":5,"value":"100 兩","unit":"些","flags":[],"cat":"丹藥","effects":["飲水 -18","食物 +7","精 +60","精 +80","氣 +150","氣 +180","形體 +25","形體 +40"]},{"id":"/obj/medication/alchemist/mjp_2","file":"source/upstream/mudlib/obj/medication/alchemist/mjp_2.c","name":"\u001b[1;31m大還丹\u001b[0m","ids":["major heal pill","major","pill"],"long":"大還丹是一種極神奇的仙丹, 具強大的療效可以讓服用者的\n內外傷在瞬間癒合, 不過煉製大還丹所需的藥材除了小還丹\n所需的幾樣藥材外, 還必需找尋雪蓮, 千年人蔘等數種罕見\n的珍貴藥材。因此, 大還丹除了燒煉困難外, 藥材之價格亦\n極昂貴。這顆丹外表呈暗紅色, 顯示火候控制相當得宜, 為\n上品之小還丹。","weight":5,"value":"100 兩","unit":"些","flags":[],"cat":"丹藥","effects":["飲水 -18","食物 +7","精 +15","精 +30","氣 +95","氣 +120","形體 +15","形體 +25"]},{"id":"/obj/medication/alchemist/mjp_3","file":"source/upstream/mudlib/obj/medication/alchemist/mjp_3.c","name":"大還丹","ids":["major heal pill","major","pill"],"long":"大還丹是一種極神奇的仙丹, 具強大的療效可以讓服用者的\n內外傷在瞬間癒合, 不過煉製大還丹所需的藥材除了小還丹\n所需的幾樣藥材外, 還必需找尋雪蓮, 千年人蔘等數種罕見\n的珍貴藥材。因此, 大還丹除了燒煉困難外, 藥材之價格亦\n極昂貴。","weight":5,"value":"100 兩","unit":"些","flags":[],"cat":"丹藥","effects":["飲水 -18","食物 +7","氣 +70","氣 +100","形體 +10","形體 +25"]},{"id":"/obj/medication/alchemist/refresh_pill","file":"source/upstream/mudlib/obj/medication/alchemist/refresh_pill.c","name":"金鎖固精丸","ids":["refresh pill","pill"],"long":"金鎖固精丸為合 d","use":"wield"}],"skills":[["天師道法【風符】",160,"taoism-storm"],["咒術",160,"spells"]],"wander":false,"ghost":false,"rooms":[["/d/snow/river1",1]]},"/custom/taoism/npc/thunder_taoist":{"id":"/custom/taoism/npc/thunder_taoist","file":"source/upstream/mudlib/custom/taoism/npc/thunder_taoist.c","name":"紫衣派弟子","ids":["purple-taoist","purple taoist","purple","taoist","紫衣派弟子"],"long":"這名紫衣派弟子精通天師道法【雷法】，手持長劍，身穿布衣。","weight":null,"value":null,"unit":null,"flags":[],"race":"avatar","class":"taoist","level":30,"gender":null,"title":null,"equip":[{"path":"/obj/area/obj/cloth","use":"wear"},{"path":"/obj/area/obj/longsword","use":"wield"}],"skills":[["天師道法【雷法】",160,"taoism-thunder"],["咒術",160,"spells"]],"wander":false,"ghost":false,"rooms":[["/d/snow/river1",1]]},"/custom/zhenwu/npc/lu_xinien":{"id":"/custom/zhenwu/npc/lu_xinien","file":"source/upstream/mudlib/custom/zhenwu/npc/lu_xinien.c","name":"魯熙年","ids":["lu xinien","lu","xinien","魯熙年"],"long":"魯熙年是一名身材微胖的中年武官，兩眼瞇成一條線，臉上總帶著似笑非笑的古怪表情。他同時也是振武營負責招募新兵的徵兵官，看起來約三十多歲。營中新兵入伍後的基本兵刃操練，多半也是他一手帶出來的。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"soldier","level":null,"gender":"male","title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[["/custom/zhenwu/room/yard10",1]]},"/custom/zhenwu/npc/mee_pei":{"id":"/custom/zhenwu/npc/mee_pei","file":"source/upstream/mudlib/custom/zhenwu/npc/mee_pei.c","name":"米沛","ids":["mee-pei","mee pei","mee","pei","米沛"],"long":"米沛是振武軍最高指揮官，身披戰甲，神情沉穩威嚴。他在軍中多年，以實戰與軍功一步步升任主將，看來約五十多歲。軍中傳聞具備相當實力的軍人可向他申請更進一步的職務，但相關條件目前仍待可靠資料補齊。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"soldier","level":null,"gender":"male","title":null,"equip":[{"path":"/custom/zhenwu/obj/steel_boots","use":"wear"},{"path":"/custom/zhenwu/obj/fire_gauntlets","use":"wear"},{"path":"/custom/zhenwu/obj/steel_armor","use":"wear"},{"path":"/custom/zhenwu/obj/great_axe_of_mighty","use":"wield"}],"skills":[["狂擊亂鬥之法",180,"berserk"],["重擊術",180,"powerblow"],["縱躍閃躲之法",120,"dodge"],["拆招卸力之法",120,"parry"],["徒手搏鬥",150,"unarmed"],["雙手斧術",150,"twohanded axe"]],"wander":false,"ghost":false,"rooms":[["/custom/zhenwu/room/big_tent",1]]},"/custom/zhenwu/npc/soldier":{"id":"/custom/zhenwu/npc/soldier","file":"source/upstream/mudlib/custom/zhenwu/npc/soldier.c","name":"小兵","ids":["soldier","小兵"],"long":"軍營裡的新兵，通常負責簡單的體力工作。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"soldier","level":null,"gender":null,"title":null,"equip":[{"path":"/d/snow/npc/obj/clothboot","use":"wear"},{"path":"/d/snow/npc/obj/helmet","use":"wear"},{"path":"/d/snow/npc/obj/leather_armor","use":"wear"},{"path":"/custom/zhenwu/obj/short_pike","use":"wield"}],"skills":[["雙手槍法",20,"twohanded pike"],["縱躍閃躲之法",10,"dodge"],["拆招卸力之法",10,"parry"]],"wander":false,"ghost":false,"rooms":[["/custom/zhenwu/room/gate",2]]},"/custom/zhenwu/npc/target_stake":{"id":"/custom/zhenwu/npc/target_stake","file":"source/upstream/mudlib/custom/zhenwu/npc/target_stake.c","name":"假人","ids":["target stake","stake","假人"],"long":"這是一具軍營內供新兵練武的粗麻木樁，樁身佈滿刀痕與箭孔。它被牢牢固定在地面，不會還手，也不會因操練而損壞，正適合反覆磨練基本招式。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"commoner","level":20,"gender":null,"title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[["/custom/zhenwu/room/yard02",5],["/custom/zhenwu/room/yard03",5],["/custom/zhenwu/room/yard13",5],["/custom/zhenwu/room/yard14",5]]},"/custom/zhenwu/npc/zhenwu_soldier":{"id":"/custom/zhenwu/npc/zhenwu_soldier","file":"source/upstream/mudlib/custom/zhenwu/npc/zhenwu_soldier.c","name":"振武軍營士兵","ids":["soldier","振武軍營士兵"],"long":"振武軍營士兵是天朝帝國邊防最基層的步兵。他身穿粗糙皮甲，手執沉重長槍，雖沒有江湖大俠般的絕頂輕功，卻有一身扎實的軍旅外家拳腳，每日都在營邊巡邏警戒。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"soldier","level":15,"gender":null,"title":null,"equip":[{"path":"/d/snow/npc/obj/clothboot","use":"wear"},{"path":"/d/snow/npc/obj/helmet","use":"wear"},{"path":"/d/snow/npc/obj/leather_armor","use":"wear"},{"path":"/obj/area/obj/pike","use":"wield"}],"skills":[["縱躍閃躲之法",60,"dodge"],["拆招卸力之法",60,"parry"],["雙手槍法",60,"twohanded pike"],["徒手搏鬥",60,"unarmed"]],"wander":false,"ghost":false,"rooms":[["/custom/zhenwu/room/yard04",5]]}},"rooms":{"/d/lee/creek":{"id":"/d/lee/creek","file":"source/upstream/mudlib/d/lee/creek.c","short":"小溪","long":"清淺溪水貼著李家村東側緩緩流過，岸邊散著大小不一的石塊。西面靠近瓜田，北面則可沿溪邊小路返回村東門。溪水清澈見底，偶爾能看見幾尾小魚悠游其中，石塊上還留著村婦浣衣時留下的濕痕。","exits":{"north":"/d/lee/riverside_s","west":"/d/lee/watermelon_n3"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[0,1,0]},"/d/lee/entrance_s":{"id":"/d/lee/entrance_s","file":"source/upstream/mudlib/d/lee/entrance_s.c","short":"村口","long":"這裡是李家村南面的村口，北方木製大門後便是村內街道。往西南沿著小路離村，便可回到雪亭一帶兩條河流交會的河邊。路邊立著一塊半人高的青石界碑年久失修，「李家村」三個字已被歲月磨得淺淡，碑角還纏著幾圈舊布條，像是往來旅客隨手繫上的平安結。幾名風塵僕僕的旅客或坐或倚在碑石邊，一邊揉著痠痛的腿腳，一邊互相打聽前方村鎮的近況。","exits":{"north":"/d/lee/gate_s","southwest":"/d/snow/egate"},"objects":{"/d/lee/npc/traveller":3},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-4,5,0]},"/d/lee/eroad1":{"id":"/d/lee/eroad1","file":"source/upstream/mudlib/d/lee/eroad1.c","short":"石子路","long":"廣場東面的石子路筆直延伸，兩側逐漸由房舍轉為田地。往東仍可看見另一段道路與村口方向。路旁的屋舍漸漸稀疏，取而代之的是連片的田埂，偶有農人挑著擔子由此經過，留下一串深淺不一的腳印。","exits":{"west":"/d/lee/square_e","east":"/d/lee/eroad2"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-3,0,0]},"/d/lee/eroad2":{"id":"/d/lee/eroad2","file":"source/upstream/mudlib/d/lee/eroad2.c","short":"石子路","long":"這段石子路鄰近村東，風中已帶著田野與溪水的氣味。向西可回廣場，向東則通往村口大門。路面兩側種著幾株矮樹，枝葉隨風輕輕搖晃，遠遠便能聽見溪水流動的聲響，替這段路添了幾分清涼。","exits":{"west":"/d/lee/eroad1","east":"/d/lee/gate_e"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-2,0,0]},"/d/lee/farm_w1":{"id":"/d/lee/farm_w1","file":"source/upstream/mudlib/d/lee/farm_w1.c","short":"農家","long":"低矮農舍圍著小院，院裡擺著竹籃、農具與曬乾的作物。屋主人多半白日下田，只留下家人照看家務。院牆邊晾著幾件洗過的衣物，隨風輕輕擺動，屋簷下掛著一串串曬乾的辣椒與玉米，透出濃濃的農家氣息。院裡的婦人手裡忙著縫補衣物，見有人經過，總會抬頭善意地點個頭。","exits":{"north":"/d/lee/wroad2","east":"/d/lee/farm_w2"},"objects":{"/d/lee/npc/woman":1},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-8,1,0]},"/d/lee/farm_w2":{"id":"/d/lee/farm_w2","file":"source/upstream/mudlib/d/lee/farm_w2.c","short":"農家","long":"另一戶農家的院牆由土磚砌成，門口靠著犁與鋤頭。雞鳴與人聲不時從院內傳出，顯得十分尋常。牆角堆著幾捆乾草，牆頭上還曬著幾張剛洗過的粗布，看得出這戶人家過得雖不寬裕，倒也打理得井井有條。","exits":{"north":"/d/lee/wroad3","west":"/d/lee/farm_w1"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-7,1,0]},"/d/lee/gate_e":{"id":"/d/lee/gate_e","file":"source/upstream/mudlib/d/lee/gate_e.c","short":"村口大門","long":"李家村東面的村口大門立在道路盡頭，門外很快便接近溪畔。木門兩旁有簡單的守望位置，方便村民巡看。厚重的木門終年開著，門板下緣已經磨出一道淺淺的弧痕，是無數車輪與腳步經年累月踩踏出來的。守衛倚在門邊的木樁上，一邊留意著往來行人，一邊靜靜聽著不遠處溪水潺潺的聲音，偶爾有村民挑著擔子經過，總會停下來寒暄兩句。","exits":{"west":"/d/lee/eroad2","east":"/d/lee/riverside_s"},"objects":{"/d/lee/npc/guard":1},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-1,0,0]},"/d/lee/gate_n":{"id":"/d/lee/gate_n","file":"source/upstream/mudlib/d/lee/gate_n.c","short":"村口大門","long":"李家村北面的村口大門由厚實木料搭成，門柱上留著長年風吹雨打的痕跡。門內石子路向南伸入村中，兩旁低矮屋舍與田地相間，來往村民大多在此放慢腳步。兩名守衛並肩站在門洞下，腰間各佩著趁手的兵器，見到生面孔進村，總會多看上兩眼。門楣上掛著一塊褪色的木匾，隱約可辨「李家村」三個字，是村里請人重新描過漆的。","exits":{"south":"/d/lee/nroad1"},"objects":{"/d/lee/npc/guard":2},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-5,-4,0]},"/d/lee/gate_s":{"id":"/d/lee/gate_s","file":"source/upstream/mudlib/d/lee/gate_s.c","short":"村口大門","long":"李家村南面的村口大門守著主要進村道路。從這裡往北就是村內街道，往南則通向村口與外面的道路。這是村里人來人往最頻繁的一道門，門洞兩側的石牆被經年的手掌磨得光滑，牆角還堆著幾捆備用的柴薪。兩名守衛神情警覺，不時交換幾句低語，遇上面生的旅人便會多打量幾眼，確認沒有可疑之處才放行。","exits":{"north":"/d/lee/street2","south":"/d/lee/entrance_s"},"objects":{"/d/lee/npc/guard":2},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-4,4,0]},"/d/lee/gate_w":{"id":"/d/lee/gate_w","file":"source/upstream/mudlib/d/lee/gate_w.c","short":"村口大門","long":"李家村西面的木製大門橫跨道路，門外道路通向村外，門內則接上筆直石子路。守衛偶爾在門旁巡看來往行人。門邊立著一根老舊的拴馬樁，樁身被繩索磨出深深的溝痕，看得出往來的行商經常在此歇腳餵馬。兩名守衛肩靠著門柱閒聊村里近日的瑣事，見有人靠近才收起話頭，恢復巡看的神色。","exits":{"east":"/d/lee/wroad1"},"objects":{"/d/lee/npc/guard":2},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-10,0,0]},"/d/lee/grocery":{"id":"/d/lee/grocery","file":"source/upstream/mudlib/d/lee/grocery.c","short":"雜貨鋪","long":"小小的雜貨鋪裡擺著油鹽、繩索、陶器與各式家常用品，貨架高低不一。這裡主要做附近村民的生意，東門通往石子路。櫃臺上擺著一把用得十分發亮的舊算盤，旁邊還堆疊著幾本記帳的簿冊，牆角還立著幾捆備用的麻繩與陶罐，看得出這裡的貨色雖不起眼，卻樣樣齊全。","exits":{"east":"/d/lee/nroad2"},"objects":{"/d/lee/npc/lee_zhong":1},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-6,-2,0]},"/d/lee/herb_shop":{"id":"/d/lee/herb_shop","file":"source/upstream/mudlib/d/lee/herb_shop.c","short":"藥鋪","long":"這是一間不大的藥鋪，木櫃裡分門別類收著藥材與丹藥，空氣中混著草根與藥香。掌櫃李岩守著櫃臺，店門朝東開向石子路。牆上掛著幾串曬乾的藥草，屋樑上懸著一副舊招牌，字跡已經有些斑駁老舊。鋪子裡賣的丹藥多是聶晟閒暇時煉的，價格公道，村民生病時多半先來這裡瞧瞧。","exits":{"east":"/d/lee/nroad1"},"objects":{"/d/lee/npc/lee_yen":1},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-6,-3,0]},"/d/lee/hunter":{"id":"/d/lee/hunter","file":"source/upstream/mudlib/d/lee/hunter.c","short":"木屋","long":"屋內陳設雖然簡單，卻處處留著長年狩獵生活的痕跡。幾件簡單的家具散落其中。牆邊掛著幾件獵具，地上還堆著幾張尚未處理的獸皮。屋子中央擺著一張木桌。桌上除了幾件零散的獵具外，還放著一塊沾滿污漬的破布，似乎已經使用了很長一段時間。","exits":{"south":"/d/lee/wroad2"},"objects":{"/d/lee/npc/lee_yong":1},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-8,-1,0]},"/d/lee/inn":{"id":"/d/lee/inn","file":"source/upstream/mudlib/d/lee/inn.c","short":"小旅店","long":"這是一間規模很小的旅店，屋裡只有幾張老舊桌椅。店小二忙著招呼客人，說書先生李半仙偶爾在此停留，東門通往街道。牆角一張矮桌上擺著粗陶茶壺與幾個缺了口的碗，看得出這裡的客人多是圖個實在，不講究排場。牆上掛著一塊掉漆的木牌，歪歪斜斜地寫著幾樣簡單的吃食。","exits":{"east":"/d/lee/street2"},"objects":{"/d/lee/npc/waiter":1,"/d/lee/npc/li_ban_xian":1},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-5,3,0]},"/d/lee/nie_backroom":{"id":"/d/lee/nie_backroom","file":"source/upstream/mudlib/d/lee/nie_backroom.c","short":"丹房","long":"這裡是醫館後方的一間小室，靠牆放著一座青銅丹爐與丹鼎，爐火尚有些許餘溫，看起來不久前才煉過藥。\n牆角一張矮榻鋪著薄被，榻邊小几上擺著一壺涼透的茶與幾卷翻開的醫書，這裡是聶晟煉丹與歇息的\n地方，平時鮮少有外人進來走動探訪打擾。","exits":{"out":"/d/lee/shrine"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-7,-2,0]},"/d/lee/nroad1":{"id":"/d/lee/nroad1","file":"source/upstream/mudlib/d/lee/nroad1.c","short":"石子路","long":"平整石子鋪成的小路穿過村北，雨後石縫仍留著些水氣。西側是一間藥鋪，門前藥香隨風散出；南北兩端都是通往村中與村口的道路。路邊立著一根老石燈籠，每逢夜色降臨，便會有人點上燈火，替晚歸的村民照亮腳下的路。","exits":{"north":"/d/lee/gate_n","south":"/d/lee/nroad2","west":"/d/lee/herb_shop"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-5,-3,0]},"/d/lee/nroad2":{"id":"/d/lee/nroad2","file":"source/upstream/mudlib/d/lee/nroad2.c","short":"石子路","long":"這段石子路兩旁房舍漸密，西側雜貨鋪門口堆著日用雜物。路面被車輪與腳步磨得發亮，向南可以繼續前往村中的廣場。路旁幾隻雞悠閒地啄著地上散落的穀粒，對來往的行人視若無睹，替這段熱鬧的路添了幾分生活氣息。","exits":{"north":"/d/lee/nroad1","south":"/d/lee/nroad3","west":"/d/lee/grocery"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-5,-2,0]},"/d/lee/nroad3":{"id":"/d/lee/nroad3","file":"source/upstream/mudlib/d/lee/nroad3.c","short":"石子路","long":"石子路到了村中心附近變得熱鬧，西側可見私塾的木門與窗紙。孩童讀書聲偶爾越牆而出，南面就是村內往來最頻繁的廣場。路邊有棵老槐樹，樹蔭下擺著一張石凳，常有村民坐著乘涼，順道聽一聽牆內傳來的讀書聲。","exits":{"north":"/d/lee/nroad2","south":"/d/lee/square_w","west":"/d/lee/school"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-5,-1,0]},"/d/lee/pawnshop":{"id":"/d/lee/pawnshop","file":"source/upstream/mudlib/d/lee/pawnshop.c","short":"李記當鋪","long":"李員外在村裡的主要生意之一，掌櫃李嘯天替李家打理此處產業。附近的旅客、店鋪都會到這典當周轉，\n櫃臺後堆著各式不同標記的木箱，看來頗為貴重。牆上掛著一幅字畫，寫著「童叟無欺」四個大字，算是給\n上門的客人先吃顆定心丸。櫃臺邊還擺著一把算盤與幾疊當票，透著幾分精打細算的生意氣息。","exits":{"east":"/d/lee/street1"},"objects":{"/d/lee/npc/lee_xiao_tian":1,"/obj/food/mooncake":2},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-5,2,0]},"/d/lee/riverside_n1":{"id":"/d/lee/riverside_n1","file":"source/upstream/mudlib/d/lee/riverside_n1.c","short":"溪邊小路","long":"沿溪小路夾在村舍與水岸之間，北面還能隱約望見拱橋方向。南北兩端都順著溪流延伸。一名村婦蹲在溪邊，手裡捧著木盆，正仔細地搓洗衣物，木盆碰撞石塊發出輕微的聲響，與潺潺水聲交織在一起。","exits":{"north":"/d/lee/riverside_n2","south":"/d/lee/riverside_s"},"objects":{"/d/lee/npc/woman":1},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[0,-1,0]},"/d/lee/riverside_n2":{"id":"/d/lee/riverside_n2","file":"source/upstream/mudlib/d/lee/riverside_n2.c","short":"溪邊小路","long":"小路沿著溪岸南北延伸，腳下散布著細碎石子。溪水貼著村東流過，附近草木因水氣而顯得格外茂盛。幾株垂柳沿岸而生，枝條輕拂水面，蕩起一圈圈細小的漣漪，替這段路添了幾分靜謐的氣氛。","exits":{"south":"/d/lee/riverside_n1"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[0,-2,0]},"/d/lee/riverside_s":{"id":"/d/lee/riverside_s","file":"source/upstream/mudlib/d/lee/riverside_s.c","short":"溪邊小路","long":"溪邊小路到了村東門附近，西面可回村口大門，南北則沿著溪岸延伸。水聲在這一帶十分清楚。幾名村婦聚在溪邊，一邊浣洗衣物一邊閒話家常，笑聲不時隨著水聲飄散開來，是這一帶少見的熱鬧光景。","exits":{"west":"/d/lee/gate_e","north":"/d/lee/riverside_n1","south":"/d/lee/creek","southwest":"/d/lee/watermelon_n3"},"objects":{"/d/lee/npc/woman":4},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[0,0,0]},"/d/lee/school":{"id":"/d/lee/school","file":"source/upstream/mudlib/d/lee/school.c","short":"私塾","long":"私塾裡整齊排著舊木桌椅，牆邊堆著幾冊翻得起毛的書本。白日常有孩童朗讀文章，窗外便是通往廣場的石子路。牆上掛著一幅「有教無類」的字幅，墨跡雖已略顯陳舊，仍看得出當年書寫時的用心。案頭擺著一方硯台與幾支毛筆，牆邊立著一根戒尺，看來平日規矩管教不算鬆散。","exits":{"east":"/d/lee/nroad3"},"objects":{"/d/lee/npc/lee_hsu_hsien":1,"/d/lee/npc/child":3},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-6,-1,0]},"/d/lee/shrine":{"id":"/d/lee/shrine","file":"source/upstream/mudlib/d/lee/shrine.c","short":"醫館","long":"這裡是聶晟看診行醫的醫館，四壁的木架上整齊排著大大小小的藥罐，靠窗的長案上攤著幾本醫書與銀針，\n一旁垂著布簾，隔出裡間看診的地方。空氣中瀰著淡淡的藥草香。十多年前村裡爆發一場怪病，便是聶晟\n在此治好了村民，李員外因此請他留下，成為村中的大夫。","exits":{"south":"/d/lee/wroad3","in":"/d/lee/nie_backroom"},"objects":{"/d/lee/npc/nee_cheng":1,"/d/lee/npc/herb_boy":2},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-7,-1,0]},"/d/lee/square_c":{"id":"/d/lee/square_c","file":"source/upstream/mudlib/d/lee/square_c.c","short":"廣場中央","long":"這裡是李家村最容易聚集人群的中央廣場，四周道路交錯。孩童常在空地追逐，村民也會停下交換消息或談論村中近事。廣場中央立著一口老水井，井欄被繩索磨出一道道深痕，是全村人取水的地方。井邊常有婦人打水閒聊，孩童們則繞著井欄追逐嬉戲，笑鬧聲響徹整個廣場。","exits":{"west":"/d/lee/square_s","north":"/d/lee/square_e","south":"/d/lee/street1"},"objects":{"/d/lee/npc/child":3,"/d/lee/obj/well":1},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-4,1,0]},"/d/lee/square_e":{"id":"/d/lee/square_e","file":"source/upstream/mudlib/d/lee/square_e.c","short":"廣場","long":"廣場向東西兩側伸展，附近商販和村民常在此碰面交換消息。往南可到廣場中央，往北可回村北道路。地面鋪著大小不一的石板，縫隙間長著幾叢野草，倒也不影響往來行走。","exits":{"west":"/d/lee/square_w","east":"/d/lee/eroad1","south":"/d/lee/square_c"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-4,0,0]},"/d/lee/square_s":{"id":"/d/lee/square_s","file":"source/upstream/mudlib/d/lee/square_s.c","short":"廣場","long":"這片廣場位在村中心偏南的位置，北面接著村中主路，東邊就是廣場中央。空地邊緣堆著幾捆備用的木料，像是村里修繕房舍時剩下的，平時倒也沒人特地搬動整理清掃。","exits":{"north":"/d/lee/square_w","east":"/d/lee/square_c"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-5,1,0]},"/d/lee/square_w":{"id":"/d/lee/square_w","file":"source/upstream/mudlib/d/lee/square_w.c","short":"廣場","long":"這片空地是村民日常往來與歇腳的地方，地面被踩得十分結實。北面連著私塾附近的道路，南面還有另一片廣場。空地一角擺著幾張長凳，木質已經有些發黑，看得出是村里人常年歇腳留下的痕跡。","exits":{"north":"/d/lee/nroad3","west":"/d/lee/wroad4","east":"/d/lee/square_e","south":"/d/lee/square_s"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-5,0,0]},"/d/lee/street1":{"id":"/d/lee/street1","file":"source/upstream/mudlib/d/lee/street1.c","short":"街道","long":"村中央往南的街道比石子路平整些，兩側屋舍緊靠。西側就是李記當鋪，南北來往的人多半從這裡穿過。屋簷下掛著幾盞燈籠，入夜後會點起微弱的燈火，照亮這段人來人往的街道。","exits":{"west":"/d/lee/pawnshop","north":"/d/lee/square_c","south":"/d/lee/street2","east":"/d/lee/watermelon_s1"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-4,2,0]},"/d/lee/street2":{"id":"/d/lee/street2","file":"source/upstream/mudlib/d/lee/street2.c","short":"街道","long":"街道繼續向南延伸，北面通往村中央，南面就是村口大門。西側的小旅店常傳出店小二招呼客人的聲音。街邊擺著一個小攤子，賣冰糖葫蘆的小販正吆喝著招攬生意，紅通通的糖葫蘆插在草把上，看著就讓人食指大動，不少路過的孩童都忍不住多看兩眼。","exits":{"north":"/d/lee/street1","west":"/d/lee/inn","south":"/d/lee/gate_s"},"objects":{"/d/lee/npc/hawthorn_seller":1},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-4,3,0]},"/d/lee/watermelon_n1":{"id":"/d/lee/watermelon_n1","file":"source/upstream/mudlib/d/lee/watermelon_n1.c","short":"西瓜田","long":"田畦裡種著一排排西瓜藤，寬大的葉片鋪滿泥地。農人沿著田埂巡看瓜苗，防著路人隨手摘走尚未成熟的西瓜。幾顆碩大的西瓜半埋在泥土裡，表皮泛著油亮的青綠色，看著十分誘人。田埂邊插著一根根竹竿，上頭綁著幾條破布條隨風擺動，是農人用來嚇唬偷嘴的鳥雀。","exits":{"east":"/d/lee/watermelon_n2","south":"/d/lee/watermelon_s1"},"objects":{"/d/lee/npc/farmer":3},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-3,1,0]},"/d/lee/watermelon_n2":{"id":"/d/lee/watermelon_n2","file":"source/upstream/mudlib/d/lee/watermelon_n2.c","short":"西瓜田","long":"大片瓜藤沿田埂向東展開，葉下偶爾露出圓滾滾的西瓜。日照充足時，田間熱氣與泥土氣味格外明顯。幾名農人戴著斗笠，彎腰仔細查看瓜藤的長勢，時不時直起身子擦一把汗，對這片瓜田的收成顯然十分上心。","exits":{"west":"/d/lee/watermelon_n1","east":"/d/lee/watermelon_n3","south":"/d/lee/watermelon_s2"},"objects":{"/d/lee/npc/farmer":3},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-2,1,0]},"/d/lee/watermelon_n3":{"id":"/d/lee/watermelon_n3","file":"source/upstream/mudlib/d/lee/watermelon_n3.c","short":"西瓜田","long":"這片西瓜田已靠近村東溪流，田邊泥土較濕，偶爾能聽見溪水聲。田埂向西與其他瓜田相連。因為靠近水源，這裡的瓜藤長得格外茂盛，葉片肥厚，藤蔓幾乎要蔓過窄窄的田埂。","exits":{"west":"/d/lee/watermelon_n2","south":"/d/lee/watermelon_s3","northeast":"/d/lee/riverside_s","east":"/d/lee/creek"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-1,1,0]},"/d/lee/watermelon_s1":{"id":"/d/lee/watermelon_s1","file":"source/upstream/mudlib/d/lee/watermelon_s1.c","short":"西瓜田","long":"田裡瓜藤交錯，農人留下的腳印沿著窄窄田埂延伸。北面與另一片瓜田緊緊相連，西面就靠近村中央街道。田埂邊散落著幾片乾枯的瓜葉，踩上去發出細碎的聲響，倒也給這片安靜的田地添了幾分生氣。","exits":{"west":"/d/lee/street1","east":"/d/lee/watermelon_s2","north":"/d/lee/watermelon_n1"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-3,2,0]},"/d/lee/watermelon_s2":{"id":"/d/lee/watermelon_s2","file":"source/upstream/mudlib/d/lee/watermelon_s2.c","short":"西瓜田","long":"一畦畦西瓜向東西排列，部分瓜實已長得相當飽滿。田間沒有遮蔭，午後常能感到土地散出的熱氣。幾隻蝴蝶在瓜藤間翩翩飛舞，偶爾停在花朵上歇息，替這片單調的田地增添了幾分生趣。","exits":{"west":"/d/lee/watermelon_s1","east":"/d/lee/watermelon_s3","north":"/d/lee/watermelon_n2"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-2,2,0]},"/d/lee/watermelon_s3":{"id":"/d/lee/watermelon_s3","file":"source/upstream/mudlib/d/lee/watermelon_s3.c","short":"西瓜田","long":"李家村東南側的瓜田延伸到溪邊附近，水氣讓此處土壤較為鬆軟。沿田埂可回到西面的其他瓜田。田邊立著一座簡陋的稻草人，衣衫破舊，隨風輕輕晃動，多少能唬住幾隻膽小的鳥雀。","exits":{"west":"/d/lee/watermelon_s2","north":"/d/lee/watermelon_n3"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-1,2,0]},"/d/lee/wroad1":{"id":"/d/lee/wroad1","file":"source/upstream/mudlib/d/lee/wroad1.c","short":"石子路","long":"這段石子路緊靠西村口，路旁泥地上留著車輪與牲口腳印。向東繼續走可以深入李家村，向西便是村口大門。路邊立著一塊簡陋的木牌，寫著「小心牲口」四個字，字跡歪斜，倒也透著幾分鄉野的樸拙。","exits":{"west":"/d/lee/gate_w","east":"/d/lee/wroad2"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-9,0,0]},"/d/lee/wroad2":{"id":"/d/lee/wroad2","file":"source/upstream/mudlib/d/lee/wroad2.c","short":"石子路","long":"石子路穿過幾戶人家之間，北邊有獵戶住處，南邊則是農家院落。村民推著小車往來，路面十分平實。路旁堆著幾張晾曬的獸皮，散發著淡淡的皮革氣味，看得出這一帶住的多是靠山吃飯的人家。","exits":{"west":"/d/lee/wroad1","east":"/d/lee/wroad3","north":"/d/lee/hunter","south":"/d/lee/farm_w1"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-8,0,0]},"/d/lee/wroad3":{"id":"/d/lee/wroad3","file":"source/upstream/mudlib/d/lee/wroad3.c","short":"石子路","long":"村西的石子路在這裡較寬，北側靠近醫館，南側仍是農家。向東再走便能抵達村中廣場。路面因為往來就診的村民較多，被踩得格外平整，偶爾能聞到醫館飄來的淡淡藥香，混著農家的泥土氣息。","exits":{"west":"/d/lee/wroad2","east":"/d/lee/wroad4","north":"/d/lee/shrine","south":"/d/lee/farm_w2"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-7,0,0]},"/d/lee/wroad4":{"id":"/d/lee/wroad4","file":"source/upstream/mudlib/d/lee/wroad4.c","short":"石子路","long":"這段石子路夾在廣場與醫館一帶之間，路面同樣鋪著碎石，偶有村民往來。兩側種著幾株低矮的灌木，替過路人擋去了些許日頭，走起來倒也不算難受。","exits":{"east":"/d/lee/square_w","west":"/d/lee/wroad3"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-6,0,0]},"/d/snow/bazar":{"id":"/d/snow/bazar","file":"source/upstream/mudlib/d/snow/bazar.c","short":"魚記小鋪","long":"這裡是一間小店鋪, 右側擺了個長架, 不甚起眼的幾件日常用品零\n零疏疏地擺在架上, 你看到了有瓶罐, 棉被, 碗盤竹筷等雜物, 不過上\n面隱隱有些灰塵黃土, 似乎這兒老闆不常清掃. 正廳有個大圓桌, 上面\n擺了些布匹服飾. 左側有個高大的櫃臺, 上面橫掛了個匾額  (look 匾\n額 ), 看來像是個小錢莊.","exits":{"west":"/d/snow/sstreet1"},"objects":{"/d/snow/npc/yu":1},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-2,4,0]},"/d/snow/bug_room":{"id":"/d/snow/bug_room","file":"source/upstream/mudlib/d/snow/bug_room.c","short":"小廣場","long":"這裏是個小廣場，幾棵樹稀稀落落的長在附近，中央有個小型的\n留言版，可供民眾回報所遭遇的怪異現象，往南可回到人聲鼎沸的雪\n亭鎮廣場。","exits":{"south":"/d/snow/square_w"},"objects":{},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-4,1,0]},"/d/snow/court":{"id":"/d/snow/court","file":"source/upstream/mudlib/d/snow/court.c","short":"鄉校","long":"這裡是雪亭鎮的鄉校﹐平常鎮民對官府的施政有什麼不滿的可以到\n這裡來向校老申訴﹐所謂的校老就是地方上有德行與聲望的老人﹐今年\n擔任校老的是開磨坊的楊老爹﹐但是他最近身體不是很好﹐並不常到鄉\n校裡來﹐往南是街道﹐北邊是一間衙堂﹐當縣裡派師爺來這裡斷事就會\n在那裡開堂。","exits":{"south":"/d/snow/wstreet3"},"objects":{"/d/snow/npc/oldman":1},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-7,2,0]},"/d/snow/ebridge":{"id":"/d/snow/ebridge","file":"source/upstream/mudlib/d/snow/ebridge.c","short":"木橋","long":"你現在來到一條橫過山澗的木橋上。\n山澗雖不甚寬﹐但是深度卻有三、四丈﹐是雪亭鎮上居民主要的飲用水源。\n木橋連通溪邊小路和東邊的山路，橋面已經有些年頭了﹐不過看起來還算堅固。\n橋下的溪水正發出轟隆轟隆的巨響流過溪谷﹐往西是雪亭鎮﹐往東則通往著名的雪吟山莊。","exits":{"west":"/d/snow/npath3"},"objects":{"/d/snow/npc/guard":2,"/custom/ghost/npc/wronged_ghost":1},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[1,0,0]},"/d/snow/egate":{"id":"/d/snow/egate","file":"source/upstream/mudlib/d/snow/egate.c","short":"河邊","long":"破舊大宅外，你眼前是兩條河流的匯流處，來自西北、東北的兩條\n小河匯流後，緩緩的向西南流去。西北邊的河流上有一座小橋，過了橋\n，沿著東北邊河流的小石子路可以通往李家村。　","exits":{"west":"/d/snow/ruin1","northeast":"/d/lee/entrance_s"},"objects":{},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[2,2,0]},"/d/snow/epath":{"id":"/d/snow/epath","file":"source/upstream/mudlib/d/snow/epath.c","short":"僻靜小巷","long":"這裡是條僻靜的小巷子﹐往西不遠處通往雪亭鎮的廣場﹐小巷的北\n面是一些瓦屋﹐圍繞著高高的圍牆﹐看來是有錢人的屋子﹐南邊有家小\n藥鋪﹐門口掛了好些曬乾的藥草﹐小巷往東是個轉角。","exits":{"east":"/d/snow/lane1","west":"/d/snow/square_e","south":"/d/snow/herb_shop"},"objects":{},"special":[{"cmd":"climb 圍牆","to":"/d/snow/kitchen"}],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-1,2,0]},"/d/snow/fireplace":{"id":"/d/snow/fireplace","file":"source/upstream/mudlib/d/snow/fireplace.c","short":"大灶內","long":"你現在正蜷縮著擠在一個大灶之中, 頭頂上方隱隱可看到煙囪的出\n口, 不過顯然沒有辦法爬出去, 這裡的牆壁因為長年燒火而變得烏黑, \n地面上積了一層厚厚的柴灰.","exits":{"out":"/d/snow/inn_kitchen"},"objects":{"/d/snow/npc/obj/woodsword":1,"/d/snow/npc/obj/woodblade":1},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-6,1,0]},"/d/snow/herb_shop":{"id":"/d/snow/herb_shop","file":"source/upstream/mudlib/d/snow/herb_shop.c","short":"小藥鋪","long":"這裡是一間小藥鋪﹐連像樣一點的招牌都沒有﹐只在門邊掛著一塊\n不甚起眼的木牌﹐上面寫著「順生堂」三個字﹐老舊的櫃臺後面陳列著\n一列藥櫃﹐藥櫃的每個抽屜按藥鋪的規矩都沒有任何標籤﹐西面的牆上\n吊著幾束曬乾的甘草﹐像這種小藥鋪沒有錢燒檀香祛除藥味﹐只好用甘\n草替代。","exits":{"north":"/d/snow/epath"},"objects":{"/d/snow/npc/herbalist":1},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-1,3,0]},"/d/snow/inn_hall":{"id":"/d/snow/inn_hall","file":"source/upstream/mudlib/d/snow/inn_hall.c","short":"客棧大堂","long":"這裡是一家客棧的大堂﹐老舊的桌椅因為經年的使用而變得烏黑黝亮。\n西邊隔著一層竹簾隱隱傳來一陣陣鍋鏟的聲音﹐大概是客棧的廚房。\n靠北邊的牆壁邊上有一道通往二樓雅座的樓梯﹐樓梯下就是櫃臺。\n東邊是客棧的出口﹐門口一串紙糊燈籠隨風搖擺﹐上面寫著「飲風客棧」：\n意思是即使你沒有錢﹐也歡迎來這裡聊天聽書﹐喝西北風。\n西南邊有一扇木門通往客棧後面的馬房。","exits":{"west":"/d/snow/inn_kitchen","east":"/d/snow/square_w"},"objects":{"/d/snow/npc/waiter":1,"/d/snow/npc/innkeeper":1,"/custom/test/obj/infinite_100_gold":1},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-5,2,0]},"/d/snow/inn_kitchen":{"id":"/d/snow/inn_kitchen","file":"source/upstream/mudlib/d/snow/inn_kitchen.c","short":"廚房","long":"這裡是一間寬敞的廚房﹐一座大灶佔據了東邊半個牆壁﹐南邊的櫃\n子整整齊齊地放著許多鍋碗瓢盆﹐這裡平常是相當忙碌的﹐如果你要在\n這裡東張西望的話﹐最好小心別被店小二端著的熱湯給燙到了﹐往東可\n以回到客棧裡。","exits":{"east":"/d/snow/inn_hall"},"objects":{},"special":[{"cmd":"enter 大灶","to":"/d/snow/fireplace"}],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-6,2,0]},"/d/snow/inn_staff_room":{"id":"/d/snow/inn_staff_room","file":"source/upstream/mudlib/d/snow/inn_staff_room.c","short":"客棧人員休息室","long":"這裡是飲風客棧後院的員工休息室，供 NPC 員工休息和放鬆。\n普通玩家無法進入這裡，巫師可以在這裡休息，或者和 NPC 員工聊天，了解客棧的內部運作。","exits":{},"objects":{},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮"},"/d/snow/kitchen":{"id":"/d/snow/kitchen","file":"source/upstream/mudlib/d/snow/kitchen.c","short":"廚房","long":"你現在正在一戶有錢人家的廚房裡﹐不過和你想像中的有錢人家廚\n房好像不太一樣﹐並沒有堆滿了雞鴨魚肉跟山珍海味﹐想來有錢人也是\n省吃儉用才能有錢的﹐廚房的門在你的南邊﹐不過鎖住了﹐東邊則是你\n進來的圍牆。","exits":{},"objects":{"/obj/food/dumpling":2},"special":[{"cmd":"climb 圍牆","to":"/d/snow/epath"}],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-1,1,0]},"/d/snow/lane1":{"id":"/d/snow/lane1","file":"source/upstream/mudlib/d/snow/lane1.c","short":"僻靜小巷","long":"這裡是條僻靜小巷的轉角處﹐小巷往北可以通往溪邊﹐從這裡就可\n以聽到溪流轟轟的聲音﹐東邊是一棟破舊的大宅院﹐門口的一的破匾寫\n著「長樂侯府」﹐不過裡面已經是斷垣殘璧了﹐小巷南邊有一座小土地\n公廟。","exits":{"north":"/d/snow/lane2","west":"/d/snow/epath","east":"/d/snow/ruin1"},"objects":{},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[0,2,0]},"/d/snow/lane2":{"id":"/d/snow/lane2","file":"source/upstream/mudlib/d/snow/lane2.c","short":"溪邊小路","long":"你現在來到一處巷子的入口﹐往北通往一條溪邊的小路﹐西邊是一\n棟大瓦屋﹐大門深鎖著﹐東邊有一家磨坊﹐磨坊屋旁一個水車正轆轆地\n轉著﹐往南通往巷子裡的一個轉角。","exits":{"south":"/d/snow/lane1","north":"/d/snow/npath3"},"objects":{},"special":[{"cmd":"enter 磨坊","to":"/d/snow/mill"}],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[0,1,0]},"/d/snow/mill":{"id":"/d/snow/mill","file":"source/upstream/mudlib/d/snow/mill.c","short":"磨坊","long":"這裡是一間以磨麵粉為業的磨坊﹐屋子裡一大半的空間被一架水車\n佔據﹐水車轉動橫過屋樑上的木軸﹐木軸推動幾個絞盤轉動屋子中央的\n石磨﹐房子的另一角堆放著一些空的麻袋。","exits":{"out":"/d/snow/lane2"},"objects":{"/d/snow/npc/miller":1},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[1,1,0]},"/d/snow/ngate":{"id":"/d/snow/ngate","file":"source/upstream/mudlib/d/snow/ngate.c","short":"山路","long":"你現在正走在一條蜿蜒的山路上﹐往南不遠處可以看見許多人家和\n房舍﹐往北則通往山上﹐山路兩旁長滿雜草﹐靠西的一面是山壁﹐東邊\n是平緩的山坡﹐山坡盡頭是一片草地。","exits":{"south":"/d/snow/nstreet2"},"objects":{"/d/snow/npc/garrison":4,"/d/snow/npc/lieutenant":1,"/custom/ghost/npc/tiger_thrall":1},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-3,-2,0]},"/d/snow/npath1":{"id":"/d/snow/npath1","file":"source/upstream/mudlib/d/snow/npath1.c","short":"小路","long":"這裡是一條黃土小路﹐往西可以回到雪亭鎮的主要街道﹐北邊是一\n片草地﹐草地盡頭則是一片樹林﹐往東你可以聽到淙淙的水聲﹐不遠處\n可以望見一條山溪。","exits":{"east":"/d/snow/npath2","west":"/d/snow/nstreet2"},"objects":{},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-2,-1,0]},"/d/snow/npath2":{"id":"/d/snow/npath2","file":"source/upstream/mudlib/d/snow/npath2.c","short":"溪邊小路","long":"這裡是一條溪邊的小路﹐從這裡可以望見北邊的山間一道瀑布從崖\n上垂下﹐穿過山坡上的一片樹林﹐以及不遠處的草地﹐往你的東南邊流\n過﹐溪水衝激著溪床的岩石﹐發出轟轟的響聲﹐往西沿著小路可以回到\n雪亭鎮的大街﹐小路向東南可以通往溪邊。","exits":{"southeast":"/d/snow/npath3","west":"/d/snow/npath1"},"objects":{"/d/snow/npc/woman":1},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-1,-1,0]},"/d/snow/npath3":{"id":"/d/snow/npath3","file":"source/upstream/mudlib/d/snow/npath3.c","short":"溪邊小路","long":"你現在來到一條溪流邊上的小路﹐溪水流過佈滿石塊的河床發出轟\n轟的聲音﹐一條木橋跨過溪流往東通往鎮外的小路﹐沿著溪邊往南不遠\n處則可以望見一間磨坊。北邊一條小路可以下到溪谷中。","exits":{"north":"/d/snow/river1","south":"/d/snow/lane2","northwest":"/d/snow/npath2","east":"/d/snow/ebridge"},"objects":{},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[0,0,0]},"/d/snow/nstreet1":{"id":"/d/snow/nstreet1","file":"source/upstream/mudlib/d/snow/nstreet1.c","short":"街道","long":"這裡是雪亭鎮北邊的主要街道﹐往南通往鎮上最熱鬧的廣場﹐往北\n則通往鎮北的山路﹐你的西邊都是一些賣雜貨的店鋪﹐這一帶除了市集\n的日子﹐並不常有太多人走動。你注意到東邊有一間不太顯眼的土地公\n廟。","exits":{"south":"/d/snow/square_n","north":"/d/snow/nstreet2","east":"/d/snow/small_temple"},"objects":{"/custom/ghost/npc/wandering_soul":1},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-3,0,0]},"/d/snow/nstreet2":{"id":"/d/snow/nstreet2","file":"source/upstream/mudlib/d/snow/nstreet2.c","short":"街道","long":"這裡是雪亭鎮北邊的主要街道﹐往南稍遠處便是一處廣場﹐往北可\n見一條蜿蜒的山路穿過長滿芒草的山坡通往野羊山上﹐東邊是一條小路\n通往溪邊﹐西邊則是一間驛站。","exits":{"west":"/d/snow/post_office","east":"/d/snow/npath1","south":"/d/snow/nstreet1","north":"/d/snow/ngate"},"objects":{"/obj/area/man":1},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-3,-1,0]},"/d/snow/post_office":{"id":"/d/snow/post_office","file":"source/upstream/mudlib/d/snow/post_office.c","short":"雪亭驛","long":"這裡是雪亭鎮的驛站﹐雖然驛站主要是替官府遞送文書﹐不過由於近年來\n土匪強盜出沒頻繁﹐也不少百姓會花一些錢請驛站的官員幫忙送信收信，喬陰\n縣的縣令認為土匪擾民是官府的施政缺失，驛站若是還收百姓的錢，實在是受\n之有愧，索性下令縣內驛站對百姓的郵遞委託一律不得收費。\n\n如果你想要收發信，可以用 request 向驛站官員領取收發信的信札。","exits":{"east":"/d/snow/nstreet2"},"objects":{},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-4,-1,0]},"/d/snow/river1":{"id":"/d/snow/river1","file":"source/upstream/mudlib/d/snow/river1.c","short":"溪邊","long":"這裡是溪流旁的亂石灘，溪流兩岸都有一丈多高，只有此處因為溪\n流彎道沖積，形成一處小石灘，水流衝激的聲音經過溪谷的回音震耳欲\n聾，往南一條小路可以回到岸邊。","exits":{"south":"/d/snow/npath3"},"objects":{"/custom/taoism/npc/fire_taoist":1,"/custom/taoism/npc/freeze_taoist":1,"/custom/taoism/npc/storm_taoist":1,"/custom/taoism/npc/thunder_taoist":1,"/custom/ghost/npc/water_goblin":1},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[0,-1,0]},"/d/snow/riverbank":{"id":"/d/snow/riverbank","file":"source/upstream/mudlib/d/snow/riverbank.c","short":"河邊空地","long":"這裡是河邊的一處空地﹐湍急的河流從你的北邊往東南邊流去﹐離\n這裡的河岸往北一丈多遠的地方可以看見一個水車﹐南邊則是一間破舊\n的大宅院﹐牆壁上一個大缺口足足可以讓人通過。","exits":{"south":"/d/snow/ruin2"},"objects":{},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[2,0,0]},"/d/snow/ruin1":{"id":"/d/snow/ruin1","file":"source/upstream/mudlib/d/snow/ruin1.c","short":"破舊大宅","long":"這裡是一間破舊大宅的前院﹐大廳已經崩塌了一半﹐焦黑的樑柱擋\n住了你的去路﹐庭院裡雜草叢生﹐看來已經很久沒有人住了﹐據說這裡\n晚上有鬼魂出現﹐但是倒也從沒聽說過有人被害﹐因此附近的居民仍然\n照常生活﹐往西可以經由大宅的正門回到街上。","exits":{"west":"/d/snow/lane1","east":"/d/snow/egate"},"objects":{"/custom/ghost/npc/wandering_soul":1},"special":[{"cmd":"climb 樑柱","to":"/d/snow/ruin2"}],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[1,2,0]},"/d/snow/ruin2":{"id":"/d/snow/ruin2","file":"source/upstream/mudlib/d/snow/ruin2.c","short":"破舊大宅正廳","long":"這裡是一棟破舊大宅的正廳﹐北面的牆壁跟屋頂已經整個坍塌了﹐\n涼颼颼的冷風從北邊的缺口直灌進來﹐另你覺得意外的是﹐這裡清掃得\n相當整潔﹐地上用乾草整整齊齊地鋪著一個床舖﹐說是流浪漢在這裡棲\n宿卻也不像﹐哪裡會有這麼愛整潔的流浪漢﹖大廳倒塌的樑柱擋住了往\n西的出口。","exits":{"north":"/d/snow/riverbank"},"objects":{"/d/snow/npc/girl":1},"special":[{"cmd":"climb 樑柱","to":"/d/snow/ruin1"}],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[2,1,0]},"/d/snow/school":{"id":"/d/snow/school","file":"source/upstream/mudlib/d/snow/school.c","short":"私塾","long":"這裡是一間私塾﹐簡單的陳設與幾張排得整整齊齊的桌椅﹐就是這\n間屋子的所有傢具﹐屋角一個大書櫃﹐裡面放著許多手抄本的古書﹐不\n過書櫃的門是鎖著的﹐最前面的桌上放著文房四寶﹐與一盆小巧的盆栽\n柏樹﹐私塾的出口在北邊。","exits":{"north":"/d/snow/wstreet1"},"objects":{"/d/snow/npc/teacher":1,"/d/snow/npc/alchemist":1,"/d/snow/npc/child3":2},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-5,4,0]},"/d/snow/sgate":{"id":"/d/snow/sgate","file":"source/upstream/mudlib/d/snow/sgate.c","short":"草棚","long":"這裡是雪亭鎮南邊的入口﹐往北穿過草棚通往雪亭鎮的街道﹐出草\n棚往鎮外有兩條路﹐往東南的路穿過雪亭南方的老松林﹐通往縣城喬陰\n﹐這條路雖然比較近﹐但是近來一群自稱老松寨的土匪常常在這一帶出\n沒﹐往西的一條沿著老松林外的大路通往鄰近的五堂鎮﹐從喬陰縣城往\n天邪國的商旅現在大多繞道走這一條路﹐因為往五堂鎮的路上有一處北\n軍府訓練新兵的軍營﹐常有軍士巡邏﹐攔路強人多半不敢滋事。","exits":{"north":"/d/snow/sstreet1","west":"/custom/zhenwu/room/gate"},"objects":{},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-3,5,0]},"/d/snow/small_temple":{"id":"/d/snow/small_temple","file":"source/upstream/mudlib/d/snow/small_temple.c","short":"土地公廟","long":"這裡是一處小而整潔的土地公廟，中央一座紅磚砌成的神龕裡供奉著一尊黑色臉龐的土地公神像。\n神龕前有一個黃銅香爐，幾注線香伴隨著輕煙散發出一種安詳的氛圍。","exits":{"west":"/d/snow/nstreet1"},"objects":{},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-2,0,0]},"/d/snow/smithy":{"id":"/d/snow/smithy","file":"source/upstream/mudlib/d/snow/smithy.c","short":"打鐵鋪子","long":"這裡是一間打鐵鋪子﹐牆上掛了許多鐵器的半成品跟工具﹐鋪子中\n間一個燒著熊熊火燄的火爐映得你在牆上的影子一晃一晃的﹐旁邊還有\n一個沈重的大鐵砧﹐鋪子的出口就在東邊。","exits":{"west":"/d/snow/square_s"},"objects":{"/d/snow/npc/smith":1},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-2,3,0]},"/d/snow/square":{"id":"/d/snow/square","file":"source/upstream/mudlib/d/snow/square.c","short":"廣場中央","long":"這裡是雪亭鎮廣場的中央﹐一株巨大的老榕樹盤根錯結地站在中央\n﹐一些孩童常常爬上這株老榕嬉戲﹐榕樹下七橫八豎地放著幾張長凳供\n人歇息聊天﹐樹旁還有一個水缸供路人取水解渴。","exits":{"east":"/d/snow/square_e","north":"/d/snow/square_n","west":"/d/snow/square_w","south":"/d/snow/square_s"},"objects":{"/d/snow/npc/obj/pot":1,"/d/snow/npc/gammer":1,"/d/snow/npc/junkman":1,"/custom/ghost/npc/hungry_ghost":2},"special":[{"cmd":"climb 榕樹","to":"/d/snow/tree"}],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-3,2,0]},"/d/snow/square_e":{"id":"/d/snow/square_e","file":"source/upstream/mudlib/d/snow/square_e.c","short":"廣場","long":"這裡是雪亭鎮廣場東邊﹐往東是一條僻靜的巷子﹐西邊有一株高大\n的榕樹﹐南邊是一家打鐵鋪子﹐不過店門不在這一邊。","exits":{"east":"/d/snow/epath","west":"/d/snow/square"},"objects":{},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-2,2,0]},"/d/snow/square_n":{"id":"/d/snow/square_n","file":"source/upstream/mudlib/d/snow/square_n.c","short":"廣場","long":"這裡是雪亭鎮廣場北邊﹐平常是附近孩童嬉戲遊玩的地方﹐初一十\n五則是市集的所在﹐往南可以看見一株大榕樹﹐往北則是一條筆直的街\n道。","exits":{"north":"/d/snow/nstreet1","south":"/d/snow/square"},"objects":{"/d/snow/npc/child1":1,"/d/snow/npc/child2":1},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-3,1,0]},"/d/snow/square_s":{"id":"/d/snow/square_s","file":"source/upstream/mudlib/d/snow/square_s.c","short":"廣場","long":"這裡是雪亭鎮廣場的南邊﹐往北可以望見一株高大的榕樹﹐廣場以\n榕樹為中心形成一個十多丈見方的大空地﹐街道往南通往鎮外﹐東邊不\n遠處有間打鐵鋪子。","exits":{"west":"/d/snow/square_sw","east":"/d/snow/smithy","north":"/d/snow/square","south":"/d/snow/sstreet1"},"objects":{},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-3,3,0]},"/d/snow/square_sw":{"id":"/d/snow/square_sw","file":"source/upstream/mudlib/d/snow/square_sw.c","short":"廣場","long":"這裡是雪亭鎮廣場的西南邊﹐廣場中央的大榕樹就在你的東北方不\n遠處﹐這裡的北邊可以看見一家客棧﹐往西是一條街道﹐東邊穿過一個\n路口可看見一家打鐵鋪子。","exits":{"west":"/d/snow/wstreet1","east":"/d/snow/square_s","north":"/d/snow/square_w"},"objects":{},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-4,3,0]},"/d/snow/square_w":{"id":"/d/snow/square_w","file":"source/upstream/mudlib/d/snow/square_w.c","short":"廣場","long":"這裡是雪亭鎮廣場的西邊﹐往東可以看見廣場中央的大榕樹。 \n一家小客棧座落在西邊不遠處﹐客棧前的一串燈籠上寫著「飲風客棧」四個大字。\n廣場上鋪著整齊的石板，在這樣的小鎮通常是因為驛站的緣故才會費事鋪設。","exits":{"south":"/d/snow/square_sw","west":"/d/snow/inn_hall","east":"/d/snow/square","north":"/d/snow/bug_room"},"objects":{"/d/snow/obj/stone":1},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-4,2,0]},"/d/snow/sstreet1":{"id":"/d/snow/sstreet1","file":"source/upstream/mudlib/d/snow/sstreet1.c","short":"街道","long":"這裡是雪亭鎮南邊連接鎮外的街道﹐西邊有一間貨棧﹐東邊則是一\n家雜貨鋪﹐街道往北通往廣場南邊﹐往南穿過一個草棚出鎮外。","exits":{"south":"/d/snow/sgate","north":"/d/snow/square_s","west":"/d/snow/store","east":"/d/snow/bazar"},"objects":{},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-3,4,0]},"/d/snow/store":{"id":"/d/snow/store","file":"source/upstream/mudlib/d/snow/store.c","short":"貨棧","long":"這裡是一間貨棧﹐也是旅行客商們儲放貨物﹐運送、轉交的地方﹐\n雪亭鎮因為位於通往天邪國的重要道路﹐所以貨棧往來的貨物相當的多\n﹐因此成為少數幾個設有貨棧的村鎮﹐天朝各地的貨棧大多數都互相連\n繫﹐因此商業十分發達﹐忙碌的貨棧也常常是缺錢的人打零工的地方﹐\n因為貨棧的工作量不固定﹐有大批貨物進來的時候往往需要平常十幾倍\n的人手﹐但是貨棧的利潤又雇不起長期的工人。","exits":{"east":"/d/snow/sstreet1"},"objects":{"/d/snow/npc/foreman":1,"/d/snow/npc/obj/wagon":1,"/d/snow/npc/obj/crate":3},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-4,4,0]},"/d/snow/tree":{"id":"/d/snow/tree","file":"source/upstream/mudlib/d/snow/tree.c","short":"榕樹上","long":"你現在正在一株巨大的榕樹上﹐茂密的枝葉搔得你有些發癢﹐前面\n一根粗大的樹枝上有人放著一塊墊子。","exits":{"down":"/d/snow/square"},"objects":{"/d/snow/npc/child":1},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-2,1,0]},"/d/snow/wgate":{"id":"/d/snow/wgate","file":"source/upstream/mudlib/d/snow/wgate.c","short":"雪亭鎮","long":"這裡是雪亭鎮西邊的官道﹐雖然雪亭驛設在鎮上的北邊﹐但是官道\n卻是從西邊入雪亭﹐因為原來修官道時利用了一段從前中陽侯征奐族亂\n軍的棧道﹐因此上這條官道便從西邊穿過山谷接古中陽棧道﹐出黃石隘\n﹐往東通往雪亭鎮的街道﹐往西則出鎮。","exits":{"east":"/d/snow/wstreet3"},"objects":{"/custom/ghost/npc/mountain_sprite":1},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-8,3,0]},"/d/snow/wstreet1":{"id":"/d/snow/wstreet1","file":"source/upstream/mudlib/d/snow/wstreet1.c","short":"街道","long":"這裡是雪亭鎮廣場西邊的街道﹐往北是一間客棧﹐不過這個方向沒\n有入口﹐南邊一間青瓦屋﹐門口灑掃得乾乾淨淨﹐似是家私塾模樣﹐往\n西的街道十分寬敞﹐路上還有車馬經過壓出來的溝痕。","exits":{"south":"/d/snow/school","east":"/d/snow/square_sw","west":"/d/snow/wstreet2"},"objects":{},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-5,3,0]},"/d/snow/wstreet2":{"id":"/d/snow/wstreet2","file":"source/upstream/mudlib/d/snow/wstreet2.c","short":"街道","long":"這裡是雪亭鎮西邊的街道﹐北邊是一間看起來像是客棧的大屋，圍\n牆上曬著一些陳舊卻潔白的衣服。南邊有間青瓦屋，幾株大樹從圍牆內\n探出頭來。","exits":{"east":"/d/snow/wstreet1","west":"/d/snow/wstreet3"},"objects":{},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-6,3,0]},"/d/snow/wstreet3":{"id":"/d/snow/wstreet3","file":"source/upstream/mudlib/d/snow/wstreet3.c","short":"街道","long":"這裡是雪亭鎮西邊的街道﹐北邊是雪亭鎮的鄉校﹐平常會有一些鎮\n上的長者在這裡談論鎮上的閒事﹐縣裡若有公爺來這裡斷事﹐也是在這\n裡設的公堂﹐往西不遠處就是出鎮的官道﹐街道南邊是一家糕餅鋪。","exits":{"north":"/d/snow/court","east":"/d/snow/wstreet2","west":"/d/snow/wgate"},"objects":{},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-7,3,0]},"/custom/zhenwu/room/big_tent":{"id":"/custom/zhenwu/room/big_tent","file":"source/upstream/mudlib/custom/zhenwu/room/big_tent.c","short":"大帳","long":"一座厚重軍帳立在校場北端，帳布經風吹日曬已略顯褪色，帳前卻收拾得一塵不亂。兩側兵器架與軍旗排列整齊，往來士卒經過此處都不自覺放輕聲音，顯示這裡是軍中主將處理軍務的地方。","exits":{"out":"/custom/zhenwu/room/yard04"},"objects":{"/custom/zhenwu/npc/mee_pei":1},"special":[],"area":"振武軍營","layer":null,"areaKey":"振武軍營","pos":[-1,-1,0]},"/custom/zhenwu/room/camp":{"id":"/custom/zhenwu/room/camp","file":"source/upstream/mudlib/custom/zhenwu/room/camp.c","short":"軍營","long":"這裡是振武軍營西側的營區入口，木柵與營帳沿路排列，來往軍士神色匆忙。東邊棚場後便是大片校場，遠處號令聲此起彼落；往東一路穿過營地，可回到雪亭鎮南方草棚附近。","exits":{"east":"/custom/zhenwu/room/shed"},"objects":{},"special":[],"area":"振武軍營","layer":null,"areaKey":"振武軍營","pos":[-3,2,0]},"/custom/zhenwu/room/gate":{"id":"/custom/zhenwu/room/gate","file":"source/upstream/mudlib/custom/zhenwu/room/gate.c","short":"振武軍營大門","long":"兩扇厚重木門構成振武軍營的主要門戶，門板外包鐵條，兩側木柵高聳。守門士兵持槍立在門旁，目光不時掃過往來人群；門內便是操練校場，軍旗與號令聲從營中不斷傳來。往東就到雪亭鎮。","exits":{"west":"/custom/zhenwu/room/yard06","east":"/d/snow/sgate"},"objects":{"/custom/zhenwu/npc/soldier":2},"special":[],"area":"振武軍營","layer":null,"areaKey":"振武軍營","pos":[2,0,0]},"/custom/zhenwu/room/shed":{"id":"/custom/zhenwu/room/shed","file":"source/upstream/mudlib/custom/zhenwu/room/shed.c","short":"棚場","long":"一排簡陋木棚沿著軍營西側搭建，棚下堆著草束、木料與日常操演所需的雜物。地面有車輪與軍靴留下的痕跡，向東便是校場，向西則可通往軍營外側。","exits":{"east":"/custom/zhenwu/room/yard10","west":"/custom/zhenwu/room/camp"},"objects":{},"special":[],"area":"振武軍營","layer":null,"areaKey":"振武軍營","pos":[-2,2,0]},"/custom/zhenwu/room/yard02":{"id":"/custom/zhenwu/room/yard02","file":"source/upstream/mudlib/custom/zhenwu/room/yard02.c","short":"校場","long":"這片校場靠近大帳，黃土地被長年操演磨得平整堅實。幾根粗木立在場邊，木身遍布刀痕與撞擊留下的缺口，北風穿過營旗時發出獵獵聲響，使整座軍營顯得肅整而緊張。","exits":{"east":"/custom/zhenwu/room/yard03","south":"/custom/zhenwu/room/yard05"},"objects":{"/custom/zhenwu/npc/target_stake":5},"special":[],"area":"振武軍營","layer":null,"areaKey":"振武軍營","pos":[0,-1,0]},"/custom/zhenwu/room/yard03":{"id":"/custom/zhenwu/room/yard03","file":"source/upstream/mudlib/custom/zhenwu/room/yard03.c","short":"校場","long":"校場東北角視野開闊，往來軍士多從這裡穿過。地上用石灰與木樁分出操練的位置，遠處可見振武軍營大門，守門軍士的身影在門樓下來回巡視，營內一切井然有序。","exits":{"west":"/custom/zhenwu/room/yard02","south":"/custom/zhenwu/room/yard06"},"objects":{"/custom/zhenwu/npc/target_stake":5},"special":[],"area":"振武軍營","layer":null,"areaKey":"振武軍營","pos":[1,-1,0]},"/custom/zhenwu/room/yard04":{"id":"/custom/zhenwu/room/yard04","file":"source/upstream/mudlib/custom/zhenwu/room/yard04.c","short":"校場","long":"這裡是校場西側，土地上散著被踏碎的草梗與細石。附近常有士卒列隊練習步伐，沉重腳步把地面踩出一道道淺痕；向北可望見大帳，向東則是軍營較寬闊的操演區。","exits":{"in":"/custom/zhenwu/room/big_tent","south":"/custom/zhenwu/room/yard07","east":"/custom/zhenwu/room/yard05"},"objects":{"/custom/zhenwu/npc/zhenwu_soldier":5},"special":[],"area":"振武軍營","layer":null,"areaKey":"振武軍營","pos":[-1,0,0]},"/custom/zhenwu/room/yard05":{"id":"/custom/zhenwu/room/yard05","file":"source/upstream/mudlib/custom/zhenwu/room/yard05.c","short":"校場","long":"校場中央人聲與兵器碰撞聲最為集中，四周黃土被反覆踩踏得幾乎不生寸草。場邊插著幾面振武軍旗，風一吹便整齊展開，讓人一踏進來便感受到軍伍特有的森嚴氣息。","exits":{"north":"/custom/zhenwu/room/yard02","south":"/custom/zhenwu/room/yard08","west":"/custom/zhenwu/room/yard04","east":"/custom/zhenwu/room/yard06"},"objects":{},"special":[],"area":"振武軍營","layer":null,"areaKey":"振武軍營","pos":[0,0,0]},"/custom/zhenwu/room/yard06":{"id":"/custom/zhenwu/room/yard06","file":"source/upstream/mudlib/custom/zhenwu/room/yard06.c","short":"校場","long":"這片校場緊鄰軍營大門，來往軍士不時從東邊經過。木製拒馬與練兵器具靠著場邊擺放，地面仍留有整隊操練形成的平直足跡，遠近都能聽見教官短促有力的號令。","exits":{"north":"/custom/zhenwu/room/yard03","south":"/custom/zhenwu/room/yard09","west":"/custom/z
