<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ES2 WebMUD Status</title><link rel="stylesheet" href="/styles.css"></head><body>
<header><h1>ES2 WebMUD · 系統狀態</h1><div><a href="/">遊戲</a> · <a href="/admin.html">工作台</a></div><span style="margin-left:auto"><a href="/map.html">世界連線圖</a></span> · <a href="/content.html">內容索引</a> · <a href="/lifecycle.html">生命週期</a> · <a href="/contracts.html">核心介面</a> · <a href="/dependencies.html">依賴鏈</a> · <a href="/audit.html">全世界審計</a> · <a href="/source.html">來源</a> · <a href="/operator.html">Operator</a> · <a href="/runtime.html">Runtime</a> · <a href="/evidence.html">Evidence</a> · <a href="/replay.html">Replay</a> · <a href="/session.html">Session</a> · <a href="/acceptance.html">Acceptance</a> · <a href="/multiplayer.html">Multiplayer</a></header>
<main><div class="card"><b>Runtime</b><pre id="runtime"></pre></div><div class="card"><b>Browser sessions</b><pre id="sessions"></pre></div><div class="card"><b>Catalog / Audit</b><pre id="audit"></pre></div><div class="card"><b>Core Audit</b><pre id="core"></pre></div></main>
<script>
async function tick(){for(const [id,url] of [['runtime','/api/status'],['sessions','/api/sessions']]){try{document.getElementById(id).textContent=JSON.stringify(await fetch(url).then(r=>r.json()),null,2)}catch(e){document.getElementById(id).textContent=e.message}}
try{document.getElementById('audit').textContent=JSON.stringify(await fetch('/api/catalog?file=audit.json').then(r=>r.json()),null,2)}catch(e){document.getElementById('audit').textContent='尚未建立 catalog/audit：'+e.message} try{document.getElementById('core').textContent=JSON.stringify(await fetch('/api/catalog?file=core_audit.json').then(r=>r.json()),null,2)}catch(e){document.getElementById('core').textContent='尚未建立 core audit：'+e.message}}
tick();setInterval(tick,5000);
</script></body></html>
